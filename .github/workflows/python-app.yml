name: Python application

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 pytest httpx
          python -m pip install -r requirements.txt
      - name: Lint bridge sources
        run: |
          python -m flake8 main.py footballdata.py test_api.py --count --select=E9,F63,F7,F82 --show-source --statistics
          python -m flake8 main.py footballdata.py test_api.py --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - name: Run bridge regression tests
        run: python -m unittest -v test_api
