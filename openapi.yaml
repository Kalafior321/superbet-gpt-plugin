openapi: 3.1.0
info:
  title: Superbet Read-only Offer Bridge
  description: 'Archiwalne i ręcznie importowane dane, bez automatycznego pobierania, potwierdzania kursów ani obstawiania.'
  version: 1.1.0
servers:
  - url: https://superbet-gpt-plugin.onrender.com
paths:
  /healthz:
    get:
      operationId: checkHealth
      summary: Status serwera bez klucza i bez pobierania danych
      responses:
        '200':
          description: Proces działa; status pobierania w treści.
  /api/kursy:
    get:
      operationId: pobierzListeMeczow
      summary: Odczytaj istniejący zaimportowany snapshot z jawnym statusem źródła
      security:
        - ApiKeyAuth: []
      parameters:
        - name: szukaj
          in: query
          schema: {type: string}
        - name: dyscyplina
          in: query
          schema: {type: string}
      responses:
        '200':
          description: Dane mogą być puste, a źródło może być niezweryfikowane.
        '401':
          description: Nieprawidłowy X-API-Key.
  /api/mecz-detale:
    get:
      operationId: pobierzWszystkieRynkiMeczu
      summary: Zwróć zapisane rynki, bez ich automatycznego odświeżania
      security:
        - ApiKeyAuth: []
      parameters:
        - name: mecz_id
          in: query
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Historyczne zaimportowane szczegóły.
        '401':
          description: Nieprawidłowy X-API-Key.
        '404':
          description: Brak identyfikatora.
  /api/import-snapshot:
    post:
      operationId: importSnapshot
      summary: Import operatora (nie automatyczny kolektor); wymaga X-API-Key
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_kind, observed_at, mecze]
              properties:
                source_kind:
                  type: string
                  enum: [manual_superbet_export, footballdata.io]
                observed_at:
                  type: string
                  format: date-time
                mecze:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
      responses:
        '200':
          description: Zaimportowano do nietrwałego cache; kursy nie są niezależnie zweryfikowane.
        '401':
          description: Brak autoryzacji.
        '422':
          description: Błąd struktury, duplikat lub podszywanie kursów FootballData pod Superbet.
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
