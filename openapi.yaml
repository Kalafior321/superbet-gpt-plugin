openapi: 3.1.0
info:
  title: Superbet Scheduled Multi-Market API
  description: Wtyczka do sprawdzania pełnej oferty kursowej i wszystkich podrynków z Superbet. Aktualizowana o 10:00 i 16:00.
  version: 1.0.0
servers:
  - url: https://superbet-gpt-plugin.onrender.com
paths:
  /api/kursy:
    get:
      summary: Pobierz listę meczów i kursy główne 1X2
      security:
        - ApiKeyAuth: []
      operationId: pobierzListeMeczow
      parameters:
        - name: szukaj
          in: query
          required: false
          description: Nazwa szukanego zespołu lub ligi.
          schema:
            type: string
        - name: dyscyplina
          in: query
          required: false
          schema:
            type: string
            enum: ["Pilka Nozna", "Tenis", "Koszykowka", "Hokej na Lodzie"]
      responses:
        '200':
          description: Sukces. Zwraca listę podstawową.
          content:
            application/json:
              schema:
                type: object
                properties:
                  metadane:
                    type: object
                    additionalProperties: true
                  liczba_meczow:
                    type: integer
                  mecze:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
  /api/mecz-detale:
    get:
      summary: Pobierz wszystkie zaawansowane rynki dla wybranego meczu
      security:
        - ApiKeyAuth: []
      operationId: pobierzWszystkieRynkiMeczu
      parameters:
        - name: mecz_id
          in: query
          required: true
          description: Identyfikator meczu pobrany z endpointu /api/kursy.
          schema:
            type: string
      responses:
        '200':
          description: Pełne zestawienie rynków i kursów.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mecz:
                    type: string
                  liga:
                    type: string
                  data_meczu:
                    type: string
                  wszystkie_rynki_oferty:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '401':
          description: Brak lub nieprawidłowy X-API-Key.
        '404':
          description: Nie znaleziono meczu.
components:
  schemas: {}
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
